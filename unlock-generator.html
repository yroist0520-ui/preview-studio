<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Studio · 解锁码生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d10;--card:#1a1a22;--border:#26262f;--text:#e8e8ee;--muted:#8b8b95;--accent:#c9a37c;--danger:#e06c6c;--ok:#6fd18a}
body{background:var(--bg);color:var(--text);font-family:'Inter',"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
h3{font-size:13px;color:#9a9aa3;margin:22px 0 10px;border-bottom:1px solid #2a2a35;padding-bottom:6px}
/* 工作区选择 */
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ws-btn{padding:12px 8px;background:#21212a;border:1px solid #3a3a45;border-radius:10px;color:#fff;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.ws-btn:hover{border-color:var(--accent)}
.ws-btn.active{background:rgba(201,163,124,.12);border-color:var(--accent);color:#e8e8ee;font-weight:600;box-shadow:0 0 0 1px rgba(201,163,124,.3) inset}
.ws-btn .code{font-size:13px;font-weight:700;display:block;letter-spacing:1px}
.ws-btn .name{font-size:11px;opacity:.75;display:block;margin-top:2px}
.ws-btn .new{font-size:10px;color:var(--accent);opacity:.8}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type-btn{padding:16px 8px;background:#21212a;border:1px solid #3a3a45;border-radius:10px;color:#fff;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.type-btn:hover{border-color:var(--accent)}
.type-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:600}
.type-btn .t{font-size:16px;font-weight:700;display:block}
.type-btn .d{font-size:11px;opacity:.75;display:block;margin-top:2px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:11px;background:#21212a;color:#fff;border:1px solid #3a3a45;border-radius:8px;font-size:14px;font-family:inherit}
/* 新增工作区 */
.add-ws{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px;background:#121218;border:1px dashed #3a3a45;border-radius:10px}
.add-ws input{flex:1;margin:0}
.add-ws button{flex:none;background:#2c2c38;border:1px solid #3a3a45;color:#fff;border-radius:6px;padding:8px 14px;font-size:12px;cursor:pointer}
.add-ws button:hover{background:#3a3a45}
button.gen{width:100%;margin-top:18px;padding:14px;background:var(--accent);color:#1a1a1a;font-weight:700;font-size:15px;border:none;border-radius:10px;cursor:pointer}
button.gen:hover{background:#d4b08c}
.codes{margin-top:20px}
.code-row{display:flex;align-items:center;gap:8px;background:#121218;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.code-row .ws-tag{font-size:10.5px;color:var(--accent);border:1px solid rgba(201,163,124,.3);border-radius:999px;padding:2px 7px;flex-shrink:0;font-weight:600}
.code-row .type-tag{font-size:10.5px;color:#9a9aa3;border:1px solid #3a3a45;border-radius:999px;padding:2px 7px;flex-shrink:0}
.code-row .code{flex:1;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;letter-spacing:.5px;word-break:break-all}
.code-row .copy{background:#2c2c38;border:1px solid #3a3a45;color:#fff;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.code-row .copy:hover{background:#3a3a45}
.note{margin-top:22px;font-size:11px;color:#555;line-height:1.7;background:#121218;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.note b{color:#888}
.back{margin-top:18px;display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🔑 解锁码生成器</h1>
    <div class="sub">每个工作区独立解锁码 · 互不通用 · 一机一用</div>

    <h3>① 选择工作区（解锁码仅对所选工作区有效）</h3>
    <div class="ws-grid" id="wsGrid">
      <!-- 按钮由 JS 渲染，支持新增自定义工作区 -->
    </div>
    <div class="add-ws" id="addWsBox" style="display:none">
      <input type="text" id="newWsId" placeholder="工作区短码（大写，如 REELS）" maxlength="8">
      <input type="text" id="newWsName" placeholder="工作区显示名（如 朋友圈 Reels）" maxlength="20">
      <button onclick="addWorkspace()">添加</button>
    </div>
    <button class="add-ws" style="border:1px solid #3a3a45;background:#21212a;cursor:pointer;font-size:12px;color:var(--accent)" onclick="document.getElementById('addWsBox').style.display='flex'">+ 新增工作区</button>

    <h3>② 选择卡类型</h3>
    <div class="type-grid">
      <button class="type-btn" data-type="DAY"><span class="t">日卡</span><span class="d">24 小时</span></button>
      <button class="type-btn active" data-type="MONTH"><span class="t">月卡</span><span class="d">30 天</span></button>
      <button class="type-btn" data-type="YEAR"><span class="t">年卡</span><span class="d">365 天</span></button>
      <button class="type-btn" data-type="FOREVER"><span class="t">永卡</span><span class="d">永久</span></button>
    </div>

    <h3>③ 生成数量</h3>
    <label>批量生成数量（1-50）</label>
    <input type="number" id="count" value="1" min="1" max="50">

    <button class="gen" onclick="generate()">生成解锁码</button>

    <div class="codes" id="codes"></div>

    <div class="note">
      <b>格式：</b>PS-{工作区短码}-{卡类型}-{8位随机}-{8位校验}，校验码签名包含工作区标识 → 不同工作区的码天然不通用。<br><br>
      <b>使用：</b>在对应工作区页面首次输入即激活，开始计时；绑定设备，一码一机。<br>
      <b>例：</b>PS-QR-MONTH-ABCD1234-XY9K7M2N 只能解锁 QR Studio，无法解锁 Preview Studio 主页。
    </div>

    <a class="back" href="./">← 返回 Preview Studio</a>
  </div>
</div>

<script>
const SECRET="PREVIEW-STUDIO-2026-SECRET-KEY";
const TYPE_LABEL={DAY:"日卡",MONTH:"月卡",YEAR:"年卡",FOREVER:"永卡"};

// 已注册的工作区（可随时新增，localStorage 持久化）
const WS_STORAGE="ps-workspaces";
let WORKSPACES=[
  {id:"HOME",name:"Preview Studio",note:"主页通用卡"},
  {id:"QR",name:"QR Studio",note:"二维码名片工作区"}
];
try{
  const saved=JSON.parse(localStorage.getItem(WS_STORAGE)||"null");
  if(Array.isArray(saved)&&saved.length){
    // 合并：保留内置 + 用户自定义（避免用户新增的被覆盖）
    WORKSPACES=saved;
  }
}catch(e){}
// 每次保存（用户新增时触发）
function saveWorkspaces(){
  try{localStorage.setItem(WS_STORAGE,JSON.stringify(WORKSPACES));}catch(e){}
}

// 与所有工作区一致的 djb2 哈希
function hash(str){
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h<<5)+h)^str.charCodeAt(i);}
  return (h>>>0).toString(36);
}
function randomStr(n){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<n;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// 生成工作区专属解锁码：校验签名包含 ws，确保独立
function generateCode(wsId,type){
  const random=randomStr(8);
  const checksum=hash(wsId+type+random+SECRET).slice(0,8).toUpperCase();
  return "PS-"+wsId+"-"+type+"-"+random+"-"+checksum;
}

// --- 渲染 ---
let currentWs="HOME";
let currentType="MONTH";

function renderWs(){
  const g=document.getElementById("wsGrid");
  g.innerHTML="";
  WORKSPACES.forEach(ws=>{
    const b=document.createElement("button");
    b.className="ws-btn"+(ws.id===currentWs?" active":"");
    b.innerHTML='<span class="code">'+ws.id+'</span><span class="name">'+ws.name+'</span>'+(ws.note?'<span class="new">'+ws.note+'</span>':"");
    b.onclick=()=>{currentWs=ws.id;renderWs();};
    g.appendChild(b);
  });
}
document.querySelectorAll(".type-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentType=btn.dataset.type;
  };
});
function addWorkspace(){
  const id=(document.getElementById("newWsId").value||"").trim().toUpperCase();
  const name=(document.getElementById("newWsName").value||"").trim();
  if(!id){alert("请输入工作区短码（如 REELS）");return;}
  if(WORKSPACES.find(w=>w.id===id)){alert("该短码已存在");return;}
  WORKSPACES.push({id,name:name||id+" 工作区",note:"用户新增"});
  saveWorkspaces();currentWs=id;renderWs();
  document.getElementById("newWsId").value="";
  document.getElementById("newWsName").value="";
  document.getElementById("addWsBox").style.display="none";
}

function generate(){
  const count=Math.min(50,Math.max(1,parseInt(document.getElementById("count").value)||1));
  const ws=WORKSPACES.find(w=>w.id===currentWs)||{id:currentWs,name:currentWs};
  const box=document.getElementById("codes");
  box.innerHTML="";
  for(let i=0;i<count;i++){
    const code=generateCode(ws.id,currentType);
    const row=document.createElement("div");
    row.className="code-row";
    row.innerHTML='<span class="ws-tag">'+ws.id+'</span>'+
                  '<span class="type-tag">'+TYPE_LABEL[currentType]+'</span>'+
                  '<span class="code">'+code+'</span>'+
                  '<button class="copy">复制</button>';
    row.querySelector(".copy").onclick=()=>{
      copyText(code);
      row.querySelector(".copy").textContent="已复制";
      setTimeout(()=>row.querySelector(".copy").textContent="复制",1200);
    };
    box.appendChild(row);
  }
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t);
  }else{
    const ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
  }
}

// 启动
renderWs();
</script>
</body>
</html>
